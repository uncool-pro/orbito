# Builds the Orbito image for a release and publishes it, for Windows/Intel and for Apple Silicon: always to ghcr.io,
# and to Docker Hub too once the repository variable DOCKERHUB_REPO (e.g. "uncoolpro/orbito") and the secrets
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token, write only) are set.
# Only the release workflow calls it (`release.yml`, after CI is green on that exact commit): a tag pushed by hand
# publishes nothing.
#   1. the image is built and scanned first; a high or critical vulnerability that already has a fix stops it here
#   2. then built for both platforms and pushed, with an SBOM and provenance attached
#   3. then signed: a build provenance attestation anyone can check with
#      `gh attestation verify oci://ghcr.io/uncool-pro/orbito:<version> --owner uncool-pro`
# A stable version is also published as `latest`, a beta (0.9.70-beta.1) as `beta`.
name: Image
on:
  workflow_call:
    inputs:
      version: { type: string, required: true }
      sha: { type: string, required: true }
      prerelease: { type: boolean, required: true }
    outputs:
      digest:
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO }}
      VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      # the version people pull must be the version the code says it is
      - run: |
          actual="$(node -p "require('./package.json').version")"
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::release $VERSION does not match package.json version $actual"
            exit 1
          fi
      # the same image under every name it is published as
      - id: tags
        run: |
          channel=latest
          if [ "$PRERELEASE" = "true" ]; then channel=beta; fi
          {
            echo 'list<<EOF'
            echo "ghcr.io/uncool-pro/orbito:$VERSION"
            echo "ghcr.io/uncool-pro/orbito:$channel"
            if [ -n "$DOCKERHUB_REPO" ]; then
              echo "docker.io/$DOCKERHUB_REPO:$VERSION"
              echo "docker.io/$DOCKERHUB_REPO:$channel"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # 1. build once for this machine and scan it before anything is published
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: orbito:scan
          cache-to: type=gha,mode=max
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: orbito:scan
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      # 2. both platforms, pushed, with a record of where the image comes from and of what is inside it
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.DOCKERHUB_REPO != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          tags: ${{ steps.tags.outputs.list }}
      # 3. signed: proof that this workflow, from this commit, built the image
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/uncool-pro/orbito
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
